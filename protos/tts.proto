syntax = "proto3";

package tts;

service TTSService {
  // 양방향 스트리밍 (Bidirectional Streaming):
  // 클라이언트가 텍스트 문장 청크를 계속 쏘아 올리고,
  // 서버는 버퍼 큐에 담아 순차 합성하면서 실시간으로 오디오 청크를 스트리밍 반환
  rpc StreamChatTTS (stream TextChunkRequest) returns (stream AudioChunkResponse);

  // 단일 문장 요청 -> 오디오 스트리밍 반환 (Server Streaming)
  rpc SynthesizeSentenceStream (TextChunkRequest) returns (stream AudioChunkResponse);

  // 단일 문장 요청 -> 완성된 전체 오디오 일괄 반환 (Unary)
  rpc SynthesizeSentence (TextChunkRequest) returns (AudioChunkResponse);

  // 엔진 난수 시드 재설정 및 모델 동기 재로드 (Cloud Run CPU 스로틀링 방지)
  rpc SetEngineSeed (SetSeedRequest) returns (SetSeedResponse);
}

message SetSeedRequest {
  int64 seed = 1;              // -1 또는 0이면 랜덤 시드, 특정 양수면 해당 시드로 고정
}

message SetSeedResponse {
  bool success = 1;            // 성공 여부
  int64 current_seed = 2;      // 설정된 실제 시드 값
  string message = 3;          // 결과 안내 메시지
  float elapsed_ms = 4;        // 재로드 및 웜업 소요 시간 (밀리초)
}

message TextChunkRequest {
  string session_id = 1;       // 대화 세션 ID (여러 세션 분기용)
  string text = 2;             // 전처리된 단일 문장 텍스트
  string text_lang = 3;        // 언어 ("ko", "ja", "en", 기본: "ko")
  string ref_audio_name = 4;   // 감정 레퍼런스 음원 ("01_ref_emoNormal026.wav" 등)
  float speed = 5;             // 배속 (기본: 1.0)
  bool is_end_of_stream = 6;   // 클라이언트 텍스트 스트림의 마지막 문장 여부
  int64 seed = 7;              // 선택적 시드 변경 (0이면 기존 시드 유지)
}

message PipelineLatency {
  float text_frontend_ms = 1;  // 텍스트 전처리(G2P) 소요 시간 (밀리초)
  float gpt_latent_ms = 2;      // GPT T2S 토큰 생성 소요 시간 (밀리초)
  float vits_decode_ms = 3;     // VITS 음향 파형 디코딩 소요 시간 (밀리초)
  float total_elapsed_ms = 4;   // 파이프라인 전체 소요 시간 (밀리초)
  float audio_duration_sec = 5; // 생성된 오디오 재생 시간 (초)
  float rtf = 6;                // Real-Time Factor (1.0 미만이면 실시간보다 빠름)
}

message AudioChunkResponse {
  string session_id = 1;        // 대화 세션 ID
  bytes pcm_data = 2;           // 32000Hz 16-bit Mono PCM 바이너리
  int32 sample_rate = 3;        // 32000
  bool is_final = 4;            // 문장 또는 스트림 종료 여부
  PipelineLatency latency = 5;  // 청크별 세부 파이프라인 소요 시간 (디버깅/모니터링용)
}
